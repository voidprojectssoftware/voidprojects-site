# Fails a PR if the site or the /api bundle would not deploy. Mirrors the build half
# of voidprojects-site-infra's deploy workflow (npm ci, build, build:api on Node 24),
# adds svelte-check, then loads the API bundle on Node 22 (the --api-version the
# deploy gives Static Web Apps) to prove every function still registers.
# Lint is not gated yet: it fails on main today (#28).
name: pr-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - run: npm run build:api

      # The Functions host runs the bundle on Node 22, so load it there.
      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Smoke-test the API bundle
        run: node scripts/smoke-api.mjs
